variables:
  # Setting a depth of 1 can result in jobs failing if they are not the latest commit when they begin executing.
  # See https://docs.gitlab.com/ee/ci/runners/configure_runners.html#shallow-cloning
  GIT_DEPTH: '3'

build:
  stage: build
  dependencies: []
  image: node:24
  timeout: 20 minutes
  before_script:
    - apt-get update
    - wget --no-verbose -O chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
    - apt-get install -q=2 -y ./chrome.deb firefox-esr | grep -v '^Selecting previously unselected package \|^Preparing to unpack \|^Unpacking \|^Setting up '
    - npm config set cache .npm --global
  script:
    - PARALLEL_BUILD=false PARALLEL_E2E=false EXPLICIT_WAIT_TIMEOUT=20000 TEST_TIMEOUT=60000 DOCKER=true npm test
    - cd build && tar -czf ../build.tar.gz .
  artifacts:
    name: refacto
    paths: [build.tar.gz]
    public: true
    expire_in: 6 hours # latest is always kept indefinitely
  cache:
    - key: { files: ['package-lock.json'] }
      paths: ['.npm']

.smoke-test: &smoke-test
  stage: test
  needs: [build]
  dependencies: [build]
  timeout: 10 minutes
  services:
    - name: mongo:9.0
      alias: mongo
      variables:
        MONGO_INITDB_ROOT_USERNAME: mongouser
        MONGO_INITDB_ROOT_PASSWORD: mongopass
    - name: redis:8-alpine
      alias: redis
    - name: postgres:18-alpine
      alias: pg
      variables:
        POSTGRES_PASSWORD: postgrespass
    - name: amazon/dynamodb-local:latest
      alias: ddb
  variables:
    GIT_STRATEGY: none
    MONGO_URL: mongodb://mongouser:mongopass@mongo:27017/
    REDIS_URL: redis://redis:6379/15
    PSQL_URL: postgresql://postgres:postgrespass@pg:5432/postgres
    DDB_URL: dynamodb://key:secret@ddb:8000/refacto-?tls=false&consistentRead=true
  before_script:
    - apk add --no-cache coreutils-env
    - tar -xf build.tar.gz && rm build.tar.gz
  script:
    - |
      set -e;

      check_launch() {
        rm output.log test-index.html 2> /dev/null || true;
        ./index.js > output.log 2>&1 & APP_PID="$!";

        while [ ! -f output.log ] || ! grep 'Available at' < output.log > /dev/null 2>&1; do
          if ! kill -0 "$APP_PID" 2> /dev/null; then
            APP_EXIT_CODE="$(wait "$APP_PID" > /dev/null; echo "$?")";
            cat output.log;
            echo "Application failed to launch (exit code: $APP_EXIT_CODE).";
            return 1;
          fi;
          sleep 0.1;
        done;

        echo "Startup successful. Checking served content...";
        wget http://localhost:5000 -O test-index.html 2> /dev/null;
        if ! grep '<title>Refacto</title>' < test-index.html > /dev/null; then
          cat output.log;
          echo "Unexpected main page response" >&2;
          cat test-index.html;
          return 1;
        fi;

        echo "Shutting down...";
        kill -2 "$APP_PID";
        wait "$APP_PID";
        if ! grep 'Shutdown complete' < output.log > /dev/null; then
          cat output.log;
          echo "Application failed to shut down" >&2;
          return 1;
        fi;

        return 0;
      }

      echo "Checking launch with in-memory DB...";
      check_launch;

      echo "Checking launch with SQLite...";
      DB_URL="sqlite://$(pwd)/sqlite.db" check_launch;

      echo "Checking launch with PostgreSQL...";
      DB_URL="$PSQL_URL" check_launch;

      echo "Checking launch with Redis...";
      DB_URL="$REDIS_URL" check_launch;

      echo "Checking launch with MongoDB...";
      DB_URL="$MONGO_URL" check_launch;

      echo "Checking launch with DynamoDB...";
      DB_URL="$DDB_URL" check_launch;

node:22:
  <<: *smoke-test
  image: node:22-alpine

node:24:
  <<: *smoke-test
  image: node:24-alpine

node:26:
  <<: *smoke-test
  image: node:26-alpine
